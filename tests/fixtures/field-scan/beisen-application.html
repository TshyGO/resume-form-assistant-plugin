<!doctype html>
<!-- #228 北森申请表的结构夹具：按金发科技页面上误识别的位置还原 DOM 结构，不含任何输入值或个人资料。
     旧规则下：页头职位搜索被叫「面试站点」，下拉内部输入被叫「请选择」，描述框被叫「0/2000」「0/4000」。 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>申请职位</title></head>
<body>
<div id="app">
  <div class="layout">
    <div class="header">
      <div class="logo"><img alt="" src="data:,"></div>
      <div class="search-box"><input type="text" class="search-input" placeholder="搜索职位"><i class="icon-search"></i></div>
      <div class="menu"><a href="#">首页</a><a href="#">社会招聘</a><a href="#">校园招聘</a></div>
    </div>
    <div class="content">
      <div class="apply-form">
        <div class="module">
          <div class="module-title">求职意向</div>
          <div class="module-body">
            <div class="form-row">
              <div class="form-label"><span class="required">*</span><span>面试站点</span></div>
              <div class="form-control">
                <div class="bs-select" aria-expanded="false">
                  <div class="bs-select-selection"><span class="bs-select-placeholder">请选择</span>
                    <input class="bs-select-search" type="text" readonly autocomplete="off"></div>
                  <div class="bs-select-dropdown-panel"><input class="bs-select-filter" type="search" placeholder="搜索"></div>
                </div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-label"><span class="required">*</span><span>意向工作地点</span></div>
              <div class="form-control">
                <div class="bs-select bs-select-multiple">
                  <div class="bs-select-selection"><span class="bs-select-placeholder">请选择</span>
                    <input class="bs-select-search" type="text" readonly autocomplete="off"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="module">
          <div class="module-title">教育经历</div>
          <div class="module-body">
            <div class="entry">
              <div class="form-row"><div class="form-label">学校名称</div><div class="form-control"><input type="text" placeholder="请输入"></div></div>
              <div class="form-row"><div class="form-label">成绩</div><div class="form-control"><input type="text" placeholder="请输入"></div></div>
            </div>
            <div class="entry">
              <div class="form-row"><div class="form-label">学校名称</div><div class="form-control"><input type="text" placeholder="请输入"></div></div>
              <div class="form-row"><div class="form-label">成绩</div><div class="form-control"><input type="text" placeholder="请输入"></div></div>
            </div>
          </div>
        </div>

        <div class="module">
          <div class="module-title">获奖情况</div>
          <div class="module-body">
            <div class="form-row"><div class="form-label">名称</div><div class="form-control"><input type="text" placeholder="请输入"></div></div>
            <div class="form-row"><div class="form-label">获奖/专利描述</div>
              <div class="form-control"><div class="textarea-wrap"><textarea placeholder="请输入"></textarea><span class="textarea-count">0/2000</span></div></div></div>
          </div>
        </div>

        <div class="module">
          <div class="module-title">学生工作经历</div>
          <div class="module-body">
            <div class="form-row"><div class="form-label">名称</div><div class="form-control"><input type="text" placeholder="请输入"></div></div>
            <div class="form-row"><div class="form-label">实践描述</div>
              <div class="form-control"><div class="textarea-wrap"><textarea placeholder="请输入"></textarea><span>0/2000</span></div></div></div>
          </div>
        </div>

        <div class="module">
          <div class="module-title">附加问题</div>
          <div class="module-body">
            <div class="form-row"><div class="form-label">在校期间是否有补考、重修情况？如有，请列出具体科目、次数以及当时的原因说明</div>
              <div class="form-control"><div class="textarea-wrap"><textarea></textarea><span>0/4000</span></div></div></div>
            <div class="form-row"><div class="form-label">请简要描述你的个人优缺点</div>
              <div class="form-control"><div class="textarea-wrap"><textarea></textarea><span>0/4000</span></div>
                <div class="form-error">此项为必填项</div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
