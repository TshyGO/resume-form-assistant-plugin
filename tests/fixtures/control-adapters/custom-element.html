window.runCases=async()=>{const operator=ResumeProControls.create();const results={};const scanned=ResumeProFieldScan.scanPage(document,{isVisible:n=>n.getBoundingClientRect().height>0});
for(const [id,value,kind] of [['degree','硕士','custom-select'],['region','广东省 / 深圳市 / 南山区','cascader'],['reject','硕士','custom-select']]){

} results.scan=ResumeProFieldScan.scanPage(document,{isVisible:n=>n.getBoundingClientRect().height>0}).controls.map(n=>({label:n.label,kind:n.controlKind}));document.getElementById('results').textContent=JSON.stringify(results,null,2);return results;};
