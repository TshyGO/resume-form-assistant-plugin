[package]
name = "resume-sheet"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Resume Pro #130: 简历模板与 Excel/CSV 互转。表头、跳行、报错口径与插件 popup.js 一致。不碰数据库，不认识 Tauri。"
publish = false

[dependencies]
# 上界卡住，只为避免无意中跨大版本；实际编译需要的 Rust 版本以 CI 的工具链（1.94）为准，
# 本 crate 的 rust-version 与其他 crate 保持一致。
calamine = ">=0.30.1, <0.31"
rust_xlsxwriter = ">=0.92.0, <0.93"
csv = "1.3"
