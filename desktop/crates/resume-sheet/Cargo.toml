[package]
name = "resume-sheet"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Resume Pro #130: 简历模板与 Excel/CSV 互转。表头、跳行、报错口径与插件 popup.js 一致。不碰数据库，不认识 Tauri。"
publish = false

[dependencies]
# 上界卡住：再往上的版本要求 Rust 1.88，而本仓库各 crate 声明的 rust-version 是 1.77.2。
calamine = ">=0.30.1, <0.31"
rust_xlsxwriter = ">=0.92.0, <0.93"
csv = "1.3"
