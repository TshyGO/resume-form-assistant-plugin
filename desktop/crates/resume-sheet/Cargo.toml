[package]
name = "resume-sheet"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Resume Pro #130: 简历模板与 Excel/CSV 互转。表头、跳行、报错口径与插件 popup.js 一致。不碰数据库，不认识 Tauri。"
publish = false

[dependencies]
# 0.36 使用修复 XML 属性复杂度漏洞的 quick-xml 0.41；保持 0.x 兼容边界。
calamine = ">=0.36.1, <0.37"
# 与 calamine 共用解析器和 ZIP 实现，在进入工作簿解析前验证资源上限。
quick-xml = { version = "0.41", features = ["encoding"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
rust_xlsxwriter = ">=0.92.0, <0.93"
csv = "1.3"
