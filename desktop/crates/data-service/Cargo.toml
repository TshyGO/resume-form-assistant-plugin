[package]
name = "data-service"
version = "0.1.0"
edition = "2021"
description = "Resume Pro unique-writer host paths, layout, and diagnostics (D02). Database schema is D03."
publish = false

[dependencies]
dirs = "6"
fslock = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3"
