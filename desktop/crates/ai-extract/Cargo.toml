[package]
name = "ai-extract"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Resume Pro D11 AI extraction contract: builds the outbound request for one piece of evidence and validates what the model sends back. It never opens a socket, never touches the database, and knows nothing about Tauri."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
