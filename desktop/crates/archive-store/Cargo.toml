[package]
name = "archive-store"
version = "0.1.0"
edition = "2021"
description = "Resume Pro D03 local archive layer: SQLite applications, events, evidence metadata, snapshots metadata, todos, AI suggestions, message receipts. Paths are injected by the host (D02)."
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
fslock = "0.2"
url = "2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "persistence_loop"
