[package]
name = "resume-pro-desktop"
version = "0.1.0"
description = "Resume Pro Desktop unique-writer host with D04 application manager"
authors = ["Resume Pro"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "resume_pro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ai-extract = { path = "../crates/ai-extract" }
archive-store = { path = "../crates/archive-store" }
backup = { path = "../crates/backup" }
data-service = { path = "../crates/data-service" }
evidence-import = { path = "../crates/evidence-import" }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
tokio = { version = "1", default-features = false, features = ["macros", "sync"] }
local-ipc = { path = "../crates/local-ipc" }
nm-frame = { path = "../crates/nm-frame" }
regex = "1"
reminders = { path = "../crates/reminders" }
resume-pro-protocol = { path = "../crates/protocol" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
