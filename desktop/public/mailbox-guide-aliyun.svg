<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title"><title id="title">阿里邮箱连接步骤示意</title><rect width="760" height="210" rx="12" fill="#f3f6fb"/><g font-family="system-ui,sans-serif" fill="#263449"><text x="24" y="34" font-size="17" font-weight="600">阿里邮箱 · 操作示意</text><rect x="24" y="55" width="332" height="60" rx="8" fill="white"/><text x="38" y="80" font-size="14">1. 打开安全 / 客户端设置</text><text x="38" y="101" font-size="13" fill="#526279">登录邮箱网页版</text><rect x="402" y="55" width="332" height="60" rx="8" fill="white"/><text x="416" y="80" font-size="14">2. 确认已开放 IMAP</text><text x="416" y="101" font-size="13" fill="#526279">按账号策略生成客户端专用密码</text><rect x="24" y="130" width="332" height="60" rx="8" fill="white"/><text x="38" y="155" font-size="14">3. 核对邮箱类型</text><text x="38" y="176" font-size="13" fill="#526279">个人邮箱与企业邮箱服务器不同</text><rect x="402" y="130" width="332" height="60" rx="8" fill="white"/><text x="416" y="155" font-size="14">4. 回到网申快填</text><text x="416" y="176" font-size="13" fill="#526279">填写后测试连接并保存</text></g></svg>
