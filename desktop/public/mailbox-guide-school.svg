<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title"><title id="title">学校 / 其他邮箱连接步骤示意</title><rect width="760" height="210" rx="12" fill="#f3f6fb"/><g font-family="system-ui,sans-serif" fill="#263449"><text x="24" y="34" font-size="17" font-weight="600">学校 / 其他邮箱 · 操作示意</text><rect x="24" y="55" width="332" height="60" rx="8" fill="white"/><text x="38" y="80" font-size="14">1. 查学校官方教程</text><text x="38" y="101" font-size="13" fill="#526279">信息中心 → 邮箱客户端设置</text><rect x="402" y="55" width="332" height="60" rx="8" fill="white"/><text x="416" y="80" font-size="14">2. 填写 IMAP 配置</text><text x="416" y="101" font-size="13" fill="#526279">服务器、端口、加密方式</text><rect x="24" y="130" width="332" height="60" rx="8" fill="white"/><text x="38" y="155" font-size="14">3. 核对账号与密码类型</text><text x="38" y="176" font-size="13" fill="#526279">按要求生成客户端专用密码</text><rect x="402" y="130" width="332" height="60" rx="8" fill="white"/><text x="416" y="155" font-size="14">4. 连接失败可手动导入</text><text x="416" y="176" font-size="13" fill="#526279">从邮箱下载 .eml 后导入文件</text></g></svg>
