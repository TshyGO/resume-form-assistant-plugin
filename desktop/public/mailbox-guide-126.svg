<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc"><title id="title">126 邮箱授权码获取步骤示意</title><desc id="desc">设置，开启IMAP，完成安全验证，生成授权码并粘贴回桌面程序。</desc><rect width="760" height="210" rx="12" fill="#f3f6fb"/><g font-family="system-ui,sans-serif" fill="#263449"><text x="24" y="34" font-size="17" font-weight="600">126 邮箱 · 网页端操作示意</text><g font-size="14"><rect x="24" y="55" width="340" height="60" rx="8" fill="white"/><text x="38" y="80">① 打开设置</text><text x="38" y="101" fill="#526279">POP3/SMTP/IMAP</text><text x="374" y="91">→</text><rect x="402" y="55" width="332" height="60" rx="8" fill="white"/><text x="416" y="80">② 找到 IMAP/SMTP 服务</text><text x="416" y="101" fill="#526279">点击开启，按页面要求验证</text><rect x="24" y="130" width="340" height="60" rx="8" fill="white"/><text x="38" y="155">③ 生成客户端授权码</text><text x="38" y="176" fill="#526279">复制新生成的授权码</text><text x="374" y="166">→</text><rect x="402" y="130" width="332" height="60" rx="8" fill="white"/><text x="416" y="155">④ 回到网申快填</text><text x="416" y="176" fill="#526279">粘贴授权码 → 测试连接并保存</text></g></g></svg>