<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title"><title id="title">iCloud连接步骤示意</title><rect width="760" height="210" rx="12" fill="#f3f6fb"/><g font-family="system-ui,sans-serif" fill="#263449"><text x="24" y="34" font-size="17" font-weight="600">iCloud · 操作示意</text><rect x="24" y="55" width="332" height="60" rx="8" fill="white"/><text x="38" y="80" font-size="14">1. 开启双重认证</text><text x="38" y="101" font-size="13" fill="#526279">登录 Apple 账户网站</text><rect x="402" y="55" width="332" height="60" rx="8" fill="white"/><text x="416" y="80" font-size="14">2. 生成 App 专用密码</text><text x="416" y="101" font-size="13" fill="#526279">登录和安全 → App 专用密码</text><rect x="24" y="130" width="332" height="60" rx="8" fill="white"/><text x="38" y="155" font-size="14">3. 核对登录账号</text><text x="38" y="176" font-size="13" fill="#526279">按官方教程使用完整地址或短用户名</text><rect x="402" y="130" width="332" height="60" rx="8" fill="white"/><text x="416" y="155" font-size="14">4. 回到网申快填</text><text x="416" y="176" font-size="13" fill="#526279">粘贴后测试连接并保存</text></g></svg>
