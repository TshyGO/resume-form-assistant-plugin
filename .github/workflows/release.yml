name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          ZIP_NAME="resume-pro-${GITHUB_REF_NAME}.zip"
          zip -r "$ZIP_NAME" .             --exclude ".git/*"             --exclude ".github/*"             --exclude "tests/*"             --exclude "docs/*"             --exclude ".gitignore"             --exclude "*.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
